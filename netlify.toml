[build]
  command = "npm run build"
  publish = "dist/voluntech-frontend/browser"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"

# Isso desativa o plugin que está causando o erro de 'routes'
[[plugins]]
  package = "@netlify/angular-runtime"
  [plugins.inputs]
    disable_ssr = true
