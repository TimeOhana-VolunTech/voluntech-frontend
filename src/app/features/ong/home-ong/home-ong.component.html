<div class="dashboard-container">
  <app-header></app-header>

  <main class="content">
    <div class="welcome-section">
      <div class="welcome-text">
        <h1>Olá, {{ nomeUsuario }}!</h1>
        <p>Gerencie seus projetos e acompanhe o impacto da sua ONG.</p>
      </div>
      <button class="btn-novo-projeto" (click)="irParaNovoProjeto()">
        + Novo Projeto
      </button>
    </div>

    <section class="projetos-lista">
      <h2>Meus Projetos Cadastrados</h2>

      <div class="cards-grid" *ngIf="projetos.length > 0; else emptyState">
        <div class="card" *ngFor="let p of projetos" (click)="abrirDetalhes(p)">
          <div class="card-header">
            <h3>{{ p.titulo }}</h3>
            <span class="status-badge" [ngClass]="{'status-pausada': p.status === 'PAUSADA'}">
              {{ p.status }}
            </span>
          </div>
          <p>{{ p.descricao }}</p>
          <div class="card-footer">
            <div class="footer-info">
              <span><i class="fa-regular fa-calendar-days"></i> {{ p.prazo | date:'dd/MM/yyyy' }}</span>
              <span><i class="fa-solid fa-location-dot"></i> {{ p.modalidade }}</span>
            </div>

            <div class="card-actions">
              <button class="btn-icon btn-edit" (click)="$event.stopPropagation(); irParaEditar(p.id!)" title="Editar">
                <i class="fa-regular fa-pen-to-square"></i>
              </button>

              <button class="btn-icon btn-status" (click)="$event.stopPropagation(); alternarStatus(p)"
                      [title]="p.status === 'ATIVA' ? 'Pausar' : 'Ativar'">
                <i [class]="p.status === 'ATIVA' ? 'fa-solid fa-pause' : 'fa-solid fa-play'"></i>
              </button>

              <button class="btn-icon btn-delete" (click)="$event.stopPropagation(); excluirProjeto(p.id!)" title="Excluir">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>
        </div>

        <app-projeto-modal
          *ngIf="projetoSelecionado"
          [projeto]="projetoSelecionado"
          (close)="fecharModal()"
          (atualizou)="recarregarLista()">
        </app-projeto-modal>
      </div>

      <ng-template #emptyState>
        <div class="empty-msg">
          <p>Você ainda não possui projetos cadastrados. Que tal criar o primeiro?</p>
        </div>
      </ng-template>
    </section>
  </main>
</div>
