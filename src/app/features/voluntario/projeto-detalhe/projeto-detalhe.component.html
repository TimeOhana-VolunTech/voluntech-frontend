<div class="modal-overlay" (click)="fechar()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <button class="btn-close" (click)="fechar()" aria-label="Fechar">&times;</button>

    <div class="modal-body" *ngIf="projeto">
      <div class="projeto-header-img">
        <img [src]="getImagemProjeto()" alt="Capa do projeto">
      </div>

      <div class="projeto-info">
        <div class="badge-row">
          <span class="badge categoria">{{ projeto.categoria }}</span>
        </div>

        <h1>{{ projeto.titulo }}</h1>
        <p class="ong-nome" *ngIf="projeto.nomeOng">Organizado por: <strong>{{ projeto.nomeOng }}</strong></p>

        <div class="detalhes-grid">
          <div class="item">
            <span class="label">📅 Prazo para Inscrição</span>
            <span class="valor">{{ projeto.prazo | date:'dd/MM/yyyy' }}</span>
          </div>
          <div class="item">
            <span class="label">📍 Modalidade</span>
            <span class="valor">{{ projeto.modalidade === 'REMOTA' ? 'Remoto' : 'Presencial' }}</span>
          </div>
        </div>

        <div class="descricao-completa">
          <h3>Sobre a oportunidade</h3>
          <p>{{ projeto.descricao }}</p>
        </div>

        <div class="modal-footer">
          <button class="btn-candidatar" (click)="candidatar()">
            Quero me Candidatar
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
